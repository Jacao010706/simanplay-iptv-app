name: Auto Rebuild All APKs

on:
  push:
    branches:
      - main
    # Push que só muda documentação não refaz os APKs de todos os revendedores.
    # Se o push tiver ao menos um arquivo fora desta lista, o rebuild roda normalmente.
    # "**/*.md" pega .md em qualquer pasta, inclusive a raiz (CLAUDE.md, README.md...).
    paths-ignore:
      - '**/*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'store/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  trigger-rebuilds:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild for all resellers
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/admin/trigger-rebuild-all" \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"github_sha": "${{ github.sha }}", "triggered_by": "push"}' \
            --fail-with-body
