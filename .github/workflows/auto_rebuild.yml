name: Auto Rebuild All APKs

on:
  push:
    branches:
      - main

jobs:
  trigger-rebuilds:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rebuild for all resellers
        run: |
          curl -X POST "${{ secrets.BACKEND_URL }}/admin/trigger-rebuild-all" \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"github_sha": "${{ github.sha }}", "triggered_by": "push"}' \
            --fail-with-body
