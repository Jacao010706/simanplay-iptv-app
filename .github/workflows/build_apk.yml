name: Build Multiplataforma

on:
  workflow_dispatch:
    inputs:
      # ── Inputs enviados pelo painel (POST /resellers/{id}/whitelabel/build) ──
      app_name:
        description: 'Nome do app'
        required: false
        default: 'PRIMETV'
      reseller_username:
        description: 'Username do revendedor'
        required: false
        default: ''
      app_subtitle:
        description: 'Subtítulo do app'
        required: false
        default: 'Conecte sua lista'
      primary_color:
        description: 'Cor principal (hex, ex: #e94bff)'
        required: false
        default: '#e94bff'
      background_color:
        description: 'Cor de fundo (hex)'
        required: false
        default: '#0d0b14'
      surface_color:
        description: 'Cor de superfície (hex)'
        required: false
        default: '#1a1625'
      app_theme:
        description: 'Tema da home (1 a 6)'
        required: false
        default: '1'
      banner_url:
        description: 'URL do banner'
        required: false
        default: ''
      logo_url:
        description: 'URL do logo'
        required: false
        default: ''
      bg_color:
        description: 'Cor de fundo (compatibilidade)'
        required: false
        default: ''
      reseller_id:
        description: 'ID do revendedor'
        required: false
        default: ''
      api_url:
        description: 'URL da API'
        required: false
        default: 'https://web-production-d8671.up.railway.app'

# Inputs entram só como variáveis de ambiente (nunca interpolados em scripts)
# e são validados por scripts/normalize_inputs.py em cada job.
env:
  IN_APP_NAME: ${{ github.event.inputs.app_name }}
  IN_APP_SUBTITLE: ${{ github.event.inputs.app_subtitle }}
  IN_PRIMARY_COLOR: ${{ github.event.inputs.primary_color }}
  IN_BACKGROUND_COLOR: ${{ github.event.inputs.background_color }}
  IN_BG_COLOR: ${{ github.event.inputs.bg_color }}
  IN_SURFACE_COLOR: ${{ github.event.inputs.surface_color }}
  IN_APP_THEME: ${{ github.event.inputs.app_theme }}
  IN_LOGO_URL: ${{ github.event.inputs.logo_url }}
  IN_BANNER_URL: ${{ github.event.inputs.banner_url }}
  IN_API_URL: ${{ github.event.inputs.api_url }}
  IN_RESELLER_ID: ${{ github.event.inputs.reseller_id }}
  IN_RESELLER_USERNAME: ${{ github.event.inputs.reseller_username }}

# ══════════════════════════════════════════════════════════════
# JOB 1: Android APK + AAB + Roku + Samsung + LG
# ══════════════════════════════════════════════════════════════
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python deps
        run: pip install Pillow requests

      - name: Normalizar dados do painel
        run: python3 scripts/normalize_inputs.py

      - name: Generate app config (lib/core/app_config.dart)
        env:
          PRIMARY_COLOR: ${{ env.PRIMARY_HEX }}
          BG_COLOR: ${{ env.BG_HEX }}
          SURFACE_COLOR: ${{ env.SURFACE_HEX }}
        run: |
          python3 scripts/generate_app_config.py
          cat lib/core/app_config.dart

      - name: Ícone do app (logo do revendedor ou PRIMETV)
        run: python3 scripts/generate_launcher_icons.py

      - name: Generate Android TV banner + Roku icons
        env:
          APP_LOGO_URL: ${{ env.LOGO_URL || env.BANNER_URL }}
          PRIMARY_COLOR: "#${{ env.PRIMARY_HEX }}"
          BG_COLOR: "#${{ env.BG_HEX }}"
        run: python3 scripts/generate_tv_assets.py

      # Canal Roku nativo (SceneGraph): valida o BrightScript e empacota para sideload/loja
      - name: Generate Roku channel
        run: |
          python3 scripts/generate_roku_manifest.py
          npx -y brighterscript@0 bsc --rootDir roku_channel --createPackage false
          cd roku_channel && zip -r "../${SLUG}_roku.zip" manifest source components images && cd ..

      # Samsung (Tizen) e LG (webOS): lançadores que abrem o app de TV do painel (/tv)
      - name: Generate Samsung (.wgt) + LG (.ipk)
        run: |
          python3 scripts/generate_tv_apps.py
          npx -y -p @webos-tools/cli ares-package build_tv/lg -o build_tv
          mv build_tv/*.ipk "${SLUG}_lg.ipk"

      - name: Flutter pub get
        run: flutter pub get

      # Chave FIXA (Secrets). Com chave nova a cada build o Android recusa
      # atualizar o app instalado ("App não instalado").
      - name: Setup Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secrets de assinatura ausentes (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/simanplay-release.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/simanplay-release.jks"
          } > android/key.properties

      # build-number crescente: o Android só instala atualização com versionCode >= ao instalado
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build AAB (Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Rename outputs
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk    "${SLUG}.apk"
          mv build/app/outputs/bundle/release/app-release.aab  "${SLUG}.aab"
          ls -la *.apk *.aab *.wgt *.ipk *_roku.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: "*.apk"
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay
          path: "*.aab"
          retention-days: 7

      - name: Upload Roku
        uses: actions/upload-artifact@v4
        with:
          name: Roku
          path: "*_roku.zip"
          retention-days: 7

      - name: Upload Samsung
        uses: actions/upload-artifact@v4
        with:
          name: Samsung
          path: "*.wgt"
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload LG
        uses: actions/upload-artifact@v4
        with:
          name: LG
          path: "*.ipk"
          retention-days: 7
          if-no-files-found: ignore

      - name: Notify backend (Android done)
        run: python3 scripts/notify_backend.py progress android done

# ══════════════════════════════════════════════════════════════
# JOB 2: iOS (.ipa)
# ══════════════════════════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Normalizar dados do painel
        run: python3 scripts/normalize_inputs.py

      - name: Generate app config (lib/core/app_config.dart)
        env:
          PRIMARY_COLOR: ${{ env.PRIMARY_HEX }}
          BG_COLOR: ${{ env.BG_HEX }}
          SURFACE_COLOR: ${{ env.SURFACE_HEX }}
        run: python3 scripts/generate_app_config.py

      - name: Ícone do app (logo do revendedor ou PRIMETV)
        run: |
          pip3 install Pillow --break-system-packages
          python3 scripts/generate_launcher_icons.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "${SLUG}.ipa" Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS
          path: "*.ipa"
          retention-days: 7

      - name: Notify backend (iOS done)
        run: python3 scripts/notify_backend.py progress ios done

# ══════════════════════════════════════════════════════════════
# JOB 3: Windows (.zip)
# ══════════════════════════════════════════════════════════════
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Normalizar dados do painel
        run: python scripts/normalize_inputs.py

      - name: Generate app config (lib/core/app_config.dart)
        env:
          PRIMARY_COLOR: ${{ env.PRIMARY_HEX }}
          BG_COLOR: ${{ env.BG_HEX }}
          SURFACE_COLOR: ${{ env.SURFACE_HEX }}
        run: python scripts/generate_app_config.py

      - name: Ícone do app (logo do revendedor ou PRIMETV)
        run: |
          pip install Pillow
          python scripts/generate_launcher_icons.py

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Empacotar Windows (.zip)
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$($env:SLUG)_windows.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: "*_windows.zip"
          retention-days: 7

      - name: Notify backend (Windows done)
        run: python scripts/notify_backend.py progress windows done

# ══════════════════════════════════════════════════════════════
# JOB 4: Publicar GitHub Release + notificar painel
# ══════════════════════════════════════════════════════════════
  publish-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-windows]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar dados do painel
        run: python3 scripts/normalize_inputs.py

      # Sem APK não há o que publicar: avisa o painel com status de erro
      # (antes o painel recebia "success" com link de APK inexistente).
      - name: Android falhou — avisar painel
        if: needs.build-android.result != 'success'
        run: |
          echo "::error::Build Android falhou (${{ needs.build-android.result }})"
          python3 scripts/notify_backend.py complete error
          exit 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List dist files
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.APP_NAME }} v${{ github.run_number }}"
          body: |
            Apps gerados automaticamente pelo painel SimanPlay.

            | Plataforma | Arquivo | Como usar |
            |---|---|---|
            | Android / Android TV | `.apk` | Instalar direto no celular/TV |
            | Google Play | `.aab` | Enviar para o Google Play Console |
            | iOS (iPhone/iPad) | `.ipa` | Instalar via AltStore |
            | Windows | `.zip` | Extrair e executar o .exe |
            | Roku TV | `_roku.zip` | Modo desenvolvedor da Roku (ver docs/TV_APPS.md) |
            | Samsung Smart TV | `_samsung_nao_assinado.wgt` | Assinar no Tizen Studio e instalar (ver docs/TV_APPS.md) |
            | LG Smart TV | `_lg.ipk` | Modo desenvolvedor LG / ares-install (ver docs/TV_APPS.md) |
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.ipa
            dist/**/*.zip
            dist/**/*.wgt
            dist/**/*.ipk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar URLs de download
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          has() { find dist/ -type f -name "$1" | grep -q .; }
          {
            echo "DL_ANDROID=${BASE}/${SLUG}.apk"
            echo "DL_GOOGLEPLAY=${BASE}/${SLUG}.aab"
            has "*.ipa"         && echo "DL_IOS=${BASE}/${SLUG}.ipa"
            has "*_windows.zip" && echo "DL_WINDOWS=${BASE}/${SLUG}_windows.zip"
            has "*_roku.zip"    && echo "DL_ROKU=${BASE}/${SLUG}_roku.zip"
            has "*.wgt"         && echo "DL_SAMSUNG=${BASE}/${SLUG}_samsung_nao_assinado.wgt"
            has "*.ipk"         && echo "DL_LG=${BASE}/${SLUG}_lg.ipk"
            echo "RELEASE_URL=${{ steps.create_release.outputs.url }}"
          } >> "$GITHUB_ENV"

      - name: Notify backend (build completo + URLs)
        run: python3 scripts/notify_backend.py complete success

      # ── JSON da página de download (GitHub Pages) ─
      - name: Save download JSON for GitHub Pages
        if: env.RESELLER_ID != ''
        run: |
          mkdir -p downloads
          python3 - <<'PY'
          import json, os
          e = os.environ
          data = {
              "name": e["APP_NAME"],
              "subtitle": "IPTV - TV ao Vivo, Filmes e Séries",
              "logoUrl": e.get("LOGO_URL", ""),
              "primaryColor": "#" + e["PRIMARY_HEX"],
              "shortUrl": f"https://primetv.lat/d/{e['RESELLER_ID']}",
              "downloads": {k[3:].lower(): v for k, v in e.items() if k.startswith("DL_")},
          }
          with open(f"downloads/{e['RESELLER_ID']}.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add "downloads/${RESELLER_ID}.json"
          git diff --cached --quiet || git commit -m "chore: update download data for ${RESELLER_ID} [skip ci]"
          git push origin HEAD:main || echo "Push falhou (conflito ignorado)"
