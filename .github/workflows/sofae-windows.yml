# Builds de teste do app Sofae: Windows e APK de teste (Android).
#
# Roda só em push na branch sofae-windows. Publica os resultados como artifacts do workflow
# (sem MSIX, sem release, sem tag). Não usa nenhum secret.
#
# A marca é aplicada como no build_apk.yml (sed nas constantes de lib/core/app_config.dart),
# pelo script .github/sofae/aplicar-marca.sh. Os ajustes só do Windows (nome do .exe, título
# da janela, ícone) e só do APK de teste (nome, ícone, applicationId) também são feitos aqui
# no CI, sem alterar os arquivos do repositório.
name: Sofae Windows

on:
  push:
    branches:
      - sofae-windows

concurrency:
  group: sofae-windows
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---------------- Valores da marca Sofae (confira aqui) ----------------
  APP_NAME: 'Sofae'
  APP_SUBTITLE: ''
  RESELLER_USERNAME: 'sofae'
  # Cores e tema: os mesmos da variante Play (lib/core/marca.dart na branch feature/sofae-release)
  PRIMARY_COLOR: '#FF8A1A'
  BACKGROUND_COLOR: '#1A0B33'
  SURFACE_COLOR: '#2E1F4D'
  APP_THEME: '6'
  # Logo (800x200) e banner (1920x1080) da Sofae, os mesmos do APK apk-sofae-147
  LOGO_URL: 'https://res.cloudinary.com/s4578vyw/image/upload/v1791816753/simanplay/whitelabel/lonqhumpockkwuramlpg.png'
  BANNER_URL: 'https://res.cloudinary.com/s4578vyw/image/upload/v1791816757/simanplay/whitelabel/gnkgzt1uovgbpmttkaqh.png'
  # Ícone: ícone oficial da Sofae (512x512) da branch feature/sofae-release, fixado no commit 59f52fe
  ICON_URL: 'https://raw.githubusercontent.com/Jacao010706/simanplay-iptv-app/59f52fe28802ac7a134419b7d7212bf843655591/store/google-play/graficos/icone-512.png'
  # Windows
  EXE_NAME: 'Sofae'
  COMPANY_NAME: 'Akitemtech'
  # JSON público com a versão mais nova do app Windows (aviso "Nova versão"). Enquanto o
  # arquivo não existir, a checagem só não mostra nada.
  WINDOWS_VERSION_URL: 'https://app.sofae.com.br/windows-version.json'
  # APK de teste: applicationId do app Sofae (com.sofae.app) + .teste, assinado com a chave de
  # debug, para instalar ao lado do app oficial sem conflito
  TEST_APPLICATION_ID: 'com.sofae.app.teste'
  TEST_APP_LABEL: 'Sofae Teste'
  # Mesma versão do Flutter do build_apk.yml
  FLUTTER_VERSION: '3.44.5'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      # O plugin FFI "jni" (dependência indireta) também compila no Windows
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Marca Sofae no AppConfig (igual ao build_apk.yml)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash .github/sofae/aplicar-marca.sh

      - name: Aviso de nova versão (URL do JSON)
        run: |
          sed -i "s|const String kWindowsVersionUrl = .*|const String kWindowsVersionUrl = '${WINDOWS_VERSION_URL}';|" lib/core/windows_update_config.dart
          grep -n "kWindowsVersionUrl =" lib/core/windows_update_config.dart

      - name: Marca Sofae no runner do Windows (nome do .exe, janela, ícone)
        run: |
          sed -i "s/set(BINARY_NAME \"[^\"]*\")/set(BINARY_NAME \"${EXE_NAME}\")/" windows/CMakeLists.txt
          sed -i "s/window.Create(L\"[^\"]*\"/window.Create(L\"${APP_NAME}\"/" windows/runner/main.cpp
          RC=windows/runner/Runner.rc
          sed -i "s/VALUE \"CompanyName\", \"[^\"]*\"/VALUE \"CompanyName\", \"${COMPANY_NAME}\"/" $RC
          sed -i "s/VALUE \"FileDescription\", \"[^\"]*\"/VALUE \"FileDescription\", \"${APP_NAME}\"/" $RC
          sed -i "s/VALUE \"InternalName\", \"[^\"]*\"/VALUE \"InternalName\", \"${EXE_NAME}\"/" $RC
          sed -i "s/VALUE \"OriginalFilename\", \"[^\"]*\"/VALUE \"OriginalFilename\", \"${EXE_NAME}.exe\"/" $RC
          sed -i "s/VALUE \"ProductName\", \"[^\"]*\"/VALUE \"ProductName\", \"${APP_NAME}\"/" $RC
          grep -n "BINARY_NAME \"" windows/CMakeLists.txt
          grep -n "window.Create" windows/runner/main.cpp
          grep -n -E "CompanyName|FileDescription|InternalName|OriginalFilename|ProductName" $RC

          python -m pip install -q Pillow
          curl -sSfL "$ICON_URL" -o "$RUNNER_TEMP/icon.png"
          python - <<'PYEOF'
          import os
          from PIL import Image
          src = Image.open(os.path.join(os.environ["RUNNER_TEMP"], "icon.png")).convert("RGBA")
          sizes = [(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
          src.save("windows/runner/resources/app_icon.ico", sizes=sizes)
          print("app_icon.ico:", sizes)
          PYEOF

      - name: Dependências
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Montar pasta do app (com runtime do Visual C++)
        run: |
          REL=build/windows/x64/runner/Release
          test -f "$REL/${EXE_NAME}.exe" || { echo "::error::${EXE_NAME}.exe não encontrado em $REL"; ls -la "$REL"; exit 1; }
          OUT="$RUNNER_TEMP/out/Sofae"
          mkdir -p "$OUT"
          cp -r "$REL"/. "$OUT"/
          # Sem estas DLLs o app não abre em PCs sem o Visual C++ Redistributable instalado
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$OUT"/
          done
          ls -la "$OUT"
          du -sh "$OUT"

      # O artifact é baixado como Sofae-Windows.zip, com a pasta Sofae\ (Sofae.exe + DLLs + data\) dentro.
      - name: Publicar artifact Sofae-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: Sofae-Windows
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: error

  build-apk-teste:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Análise e testes (suíte inteira)
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Marca Sofae no AppConfig (igual ao build_apk.yml)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash .github/sofae/aplicar-marca.sh

      - name: Nome, ícone e banner do APK de teste
        run: |
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${TEST_APP_LABEL}\"/" android/app/src/main/AndroidManifest.xml
          grep -o 'android:label="[^"]*"' android/app/src/main/AndroidManifest.xml | head -1
          pip install -q Pillow
          curl -sSfL "$ICON_URL" -o /tmp/icon_source.png
          curl -sSfL "$BANNER_URL" -o /tmp/banner_source.png
          python3 - <<'PYEOF'
          import os
          from PIL import Image
          bg_hex = os.environ["BACKGROUND_COLOR"].lstrip("#")
          bg = tuple(int(bg_hex[i:i+2], 16) for i in (0, 2, 4)) + (255,)

          def fit(img, w, h, pad, fill):
              canvas = Image.new("RGBA", (w, h), fill)
              box_w, box_h = int(w * (1 - 2 * pad)), int(h * (1 - 2 * pad))
              im = img.copy()
              im.thumbnail((box_w, box_h), Image.LANCZOS)
              canvas.alpha_composite(im, ((w - im.width) // 2, (h - im.height) // 2))
              return canvas

          base = "android/app/src/main/res"
          icon = Image.open("/tmp/icon_source.png").convert("RGBA")
          for folder, size in {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                               "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}.items():
              icon.resize((size, size), Image.LANCZOS).save(f"{base}/{folder}/ic_launcher.png")
          banner = Image.open("/tmp/banner_source.png").convert("RGBA")
          for folder, (w, h) in {"mipmap-mdpi": (320, 180), "mipmap-hdpi": (480, 270),
                                 "mipmap-xhdpi": (640, 360), "mipmap-xxhdpi": (960, 540),
                                 "mipmap-xxxhdpi": (1280, 720)}.items():
              fit(banner, w, h, 0.0, bg).save(f"{base}/{folder}/tv_banner.png")
          print("ícones e banners gerados")
          PYEOF

      # Sem android/key.properties o build.gradle.kts assina o release com a chave de debug
      - name: Build APK de teste (assinatura de debug)
        env:
          APPLICATION_ID: ${{ env.TEST_APPLICATION_ID }}
        run: |
          test ! -e android/key.properties || { echo "::error::key.properties não deveria existir aqui"; exit 1; }
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }}
          mkdir -p "$RUNNER_TEMP/apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk/Sofae-Teste.apk"

      - name: Conferir applicationId e assinatura de debug
        run: |
          APK="$RUNNER_TEMP/apk/Sofae-Teste.apk"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -1
          "$AAPT" dump badging "$APK" | grep -q "package: name='${TEST_APPLICATION_ID}'" \
            || { echo "::error::applicationId diferente de ${TEST_APPLICATION_ID}"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256 digest" | head -2
          "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug" \
            || { echo "::error::o APK de teste não está com a assinatura de debug"; exit 1; }
          ls -la "$APK"

      - name: Publicar artifact Sofae-APK-Teste
        uses: actions/upload-artifact@v4
        with:
          name: Sofae-APK-Teste
          path: ${{ runner.temp }}/apk/Sofae-Teste.apk
          retention-days: 14
          if-no-files-found: error
