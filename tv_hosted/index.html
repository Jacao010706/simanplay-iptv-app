<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>__APP_NAME_HTML__</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#__BG_HEX__;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
  /* Sem flex/gap: TVs antigas (Tizen 2.3, webOS 1-3) têm suporte incompleto */
  .wrap{position:absolute;top:50%;left:0;width:100%;text-align:center;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
  .name{font-size:72px;font-weight:bold;letter-spacing:2px;color:#__PRIMARY_HEX__;margin-bottom:28px}
  .msg{font-size:30px;color:#ccc;margin:28px auto 0;max-width:1200px}
  .dot{width:18px;height:18px;border-radius:50%;background:#__PRIMARY_HEX__;display:inline-block;margin:0 6px;
       -webkit-animation:b 1.2s infinite;animation:b 1.2s infinite}
  .dot:nth-child(2){-webkit-animation-delay:.2s;animation-delay:.2s}
  .dot:nth-child(3){-webkit-animation-delay:.4s;animation-delay:.4s}
  @-webkit-keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="name">__APP_NAME_HTML__</div>
  <div id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="msg" id="msg"></div>
</div>
<script>
// Lançador: o app de verdade roda no painel (atualiza sem reinstalar na TV).
var TARGET = "__TARGET_URL__";
var tries = 0;

// Samsung: libera as teclas coloridas/mídia para o app (voltar/setas já vêm liberadas)
try {
  if (window.tizen && tizen.tvinputdevice) {
    var keys = ["MediaPlayPause", "MediaPlay", "MediaPause", "MediaStop", "ColorF0Red", "ColorF1Green",
                "ColorF2Yellow", "ColorF3Blue", "ChannelUp", "ChannelDown"];
    for (var i = 0; i < keys.length; i++) {
      try { tizen.tvinputdevice.registerKey(keys[i]); } catch (e) {}
    }
  }
} catch (e) {}

function exitApp() {
  try { if (window.tizen) { tizen.application.getCurrentApplication().exit(); return; } } catch (e) {}
  try { if (window.webOS && webOS.platformBack) { webOS.platformBack(); return; } } catch (e) {}
  try { window.close(); } catch (e) {}
}

document.addEventListener("keydown", function (e) {
  // Voltar (Samsung 10009 / LG 461) nesta tela sai do app
  if (e.keyCode === 10009 || e.keyCode === 461) { exitApp(); }
});

function start() {
  tries++;
  if (navigator.onLine === false) {
    document.getElementById("msg").textContent = "Sem conexão com a internet. Verifique a rede da TV. Tentando de novo...";
    setTimeout(start, 5000);
    return;
  }
  // Checa se o painel responde antes de trocar de página (evita tela de erro do navegador)
  var x = new XMLHttpRequest();
  x.open("GET", TARGET.split("?")[0] + "?ping=" + Date.now(), true);
  x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 400) {
      location.replace(TARGET);
    } else {
      retry("Servidor indisponível (" + (x.status || "sem resposta") + ").");
    }
  };
  x.ontimeout = function () { retry("O servidor demorou para responder."); };
  x.onerror = function () { retry("Não foi possível conectar ao servidor."); };
  x.send();
}

function retry(reason) {
  var wait = Math.min(30, 5 * tries);
  document.getElementById("msg").textContent = reason + " Tentando novamente em " + wait + "s...";
  setTimeout(start, wait * 1000);
}

start();
</script>
</body>
</html>
