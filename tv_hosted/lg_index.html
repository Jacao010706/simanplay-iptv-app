<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>__APP_NAME_HTML__</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#__BG_HEX__;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
  /* Sem flex/gap: TVs antigas (webOS 1-3) têm suporte incompleto */
  .wrap{position:absolute;top:50%;left:0;width:100%;text-align:center;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
  .name{font-size:72px;font-weight:bold;letter-spacing:2px;color:#__PRIMARY_HEX__;margin-bottom:28px}
  .msg{font-size:30px;color:#ccc;margin:28px auto 0;max-width:1200px}
  .sub{font-size:24px;color:#888;margin:14px auto 0;max-width:1200px}
  .dot{width:18px;height:18px;border-radius:50%;background:#__PRIMARY_HEX__;display:inline-block;margin:0 6px;
       -webkit-animation:b 1.2s infinite;animation:b 1.2s infinite}
  .dot:nth-child(2){-webkit-animation-delay:.2s;animation-delay:.2s}
  .dot:nth-child(3){-webkit-animation-delay:.4s;animation-delay:.4s}
  @-webkit-keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
  #offline{display:none}
  .btn{display:inline-block;margin:40px 14px 0;padding:22px 48px;font-size:30px;border-radius:12px;
       background:#2a2538;color:#fff;border:4px solid transparent;cursor:pointer}
  .btn.on{background:#__PRIMARY_HEX__;border-color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="name">__APP_NAME_HTML__</div>
  <div id="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div id="offline">
    <div class="msg">Sem conexão</div>
    <div class="sub" id="reason"></div>
    <div>
      <span class="btn on" id="btnRetry" onclick="retryNow()">Tentar novamente</span>
      <span class="btn" id="btnExit" onclick="exitApp()">Sair</span>
    </div>
  </div>
</div>
<script>
// Casca: as telas do app vêm do painel (TARGET), então correções no /tv chegam às TVs
// sem nova versão na loja. Sem conexão: tela com "Tentar novamente" pelo controle.
var TARGET = "__TARGET_URL__";
var selected = 0;   // 0 = Tentar novamente, 1 = Sair
var autoRetry = null;
var checking = false;

function exitApp() {
  try { if (window.webOS && webOS.platformBack) { webOS.platformBack(); return; } } catch (e) {}
  try { window.close(); } catch (e) {}
}

function el(id) { return document.getElementById(id); }

function select(i) {
  selected = i;
  el("btnRetry").className = "btn" + (i === 0 ? " on" : "");
  el("btnExit").className = "btn" + (i === 1 ? " on" : "");
}

function showLoading() {
  el("offline").style.display = "none";
  el("loading").style.display = "block";
}

function showOffline(reason) {
  checking = false;
  el("loading").style.display = "none";
  el("offline").style.display = "block";
  el("reason").textContent = reason + " Verifique a internet da TV.";
  select(0);
  if (autoRetry) clearTimeout(autoRetry);
  autoRetry = setTimeout(retryNow, 30000);   // tenta sozinho a cada 30 s
}

function retryNow() {
  if (autoRetry) { clearTimeout(autoRetry); autoRetry = null; }
  start();
}

document.addEventListener("keydown", function (e) {
  var k = e.keyCode;
  // Voltar (LG 461) nesta tela sai do app
  if (k === 461 || k === 27) { e.preventDefault(); exitApp(); return; }
  if (el("offline").style.display !== "block") return;
  if (k === 37 || k === 38) { e.preventDefault(); select(0); }
  else if (k === 39 || k === 40) { e.preventDefault(); select(1); }
  else if (k === 13) { e.preventDefault(); if (selected === 0) { retryNow(); } else { exitApp(); } }
});

function start() {
  if (checking) return;
  checking = true;
  showLoading();
  if (navigator.onLine === false) { showOffline("A TV está sem internet."); return; }
  // Checa se o painel responde antes de trocar de página (evita a tela de erro do navegador)
  var x = new XMLHttpRequest();
  x.open("GET", TARGET.split("?")[0] + "?ping=" + Date.now(), true);
  x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    if (x.status >= 200 && x.status < 400) {
      location.replace(TARGET);
    } else {
      // status 0 = sem resposta (algumas TVs antigas não disparam onerror)
      showOffline(x.status ? "O servidor não respondeu (" + x.status + ")." : "Não foi possível conectar ao servidor.");
    }
  };
  x.ontimeout = function () { showOffline("O servidor demorou para responder."); };
  x.onerror = function () { showOffline("Não foi possível conectar ao servidor."); };
  x.send();
}

start();
</script>
</body>
</html>
